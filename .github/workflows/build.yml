name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache Gradle 8.4 distribution (evita re-descargar 120MB en cada run)
        uses: actions/cache@v4
        with:
          path: /home/runner/.gradle/wrapper/dists
          key: gradle-dist-8-4-v1
      - name: Ensure fixed keystore (stable signature for updates)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storetype PKCS12 \
              -storepass jedl2026 -keypass jedl2026 -alias jedl \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=JEDL Studio, O=JEDL, C=CU"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add debug.keystore
            git commit -m "Add fixed debug keystore (stable signing)"
            git push
          fi
      - name: Download MediaPipe + CartoonGAN models
        run: |
          mkdir -p app/src/main/assets
          curl -fL --connect-timeout 20 --max-time 240 --retry 3 --retry-delay 5 -o app/src/main/assets/pose_landmarker.task https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
          curl -fL --connect-timeout 20 --max-time 240 --retry 3 --retry-delay 5 -o app/src/main/assets/selfie_multiclass_256x256.tflite https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/1/selfie_multiclass_256x256.tflite
          # White-box CartoonGAN (estilo anime offline, Apache 2.0).
          # Kaggle Models API publica: variacion "dr" (2.57 MB, 512x512, BGR)
          # publicada por el autor del modelo (spsayakpaul/cartoongan).
          # Fallback: TF Hub fp16 (misma familia, forma leida en runtime).
          set +e
          curl -fL --connect-timeout 20 --max-time 240 --retry 3 --retry-delay 5 -o app/src/main/assets/whitebox_cartoon_gan_dr.tflite "https://www.kaggle.com/api/v1/models/spsayakpaul/cartoongan/tfLite/dr/1/download"
          SZ=$(stat -c%s app/src/main/assets/whitebox_cartoon_gan_dr.tflite 2>/dev/null || echo 0)
          if [ "${SZ}" -lt 1000000 ]; then
            echo "Kaggle fallo (${SZ} bytes), probando TF Hub..."
            curl -fL --connect-timeout 20 --max-time 240 --retry 3 --retry-delay 5 -o app/src/main/assets/whitebox_cartoon_gan_dr.tflite "https://tfhub.dev/sayakpaul/lite-model/cartoongan/fp16/1?tf-hub-format=lite"
            SZ=$(stat -c%s app/src/main/assets/whitebox_cartoon_gan_dr.tflite 2>/dev/null || echo 0)
          fi
          set -e
          echo "CartoonGAN tflite: ${SZ} bytes"
          if [ "${SZ}" -lt 1000000 ]; then echo "::error::El modelo CartoonGAN no se descargo bien (${SZ} bytes)"; exit 1; fi
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.4
      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build_log.txt 2>&1
          status=$?
          set -e
          grep -E "^e: |error: " build_log.txt | head -12 > build_errors.txt || true
          if [ -s build_errors.txt ]; then
            while IFS= read -r line; do
              echo "::error::$(echo "$line" | sed 's|file:///home/runner/work/||' | cut -c1-220)"
            done < build_errors.txt
          fi
          tail -20 build_log.txt
          exit $status
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
